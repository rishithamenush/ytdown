org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# Drop unused resources from libraries (smaller APK).
android.enableResourceOptimizations=true
# Skip JNI for non-target ABIs — we ship only ARM + x86_64 via splits.
android.bundle.enableUncompressedNativeLibs=true
